<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="./script.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Rock Paper Scissors</title>
</head>
<body class="flex flex-col gap-8 items-center justify-center h-screen bg-gray-700">
    <div class="flex flex-col items-center justify-center text-white">
        <h1 class="text-4xl font-bold">Rock Paper Scissors</h1>
        <p class="text-lg font-semibold mb-4">Choose your weapon</p>
        <div class="flex justify-evenly gap-4">
            <p class="text-lg">You: <span id="userScore" class="font-semibold"></span></p>
            <p class="text-lg">Computer: <span id="computerScore" class="font-semibold"></span></p>
        </div>
        
    </div>
    <div class="flex flex-row gap-4">
        <button class="flex-1 bg-blue-500 text-white px-4 py-2 rounded-md text-center justify-center" id="rock">Rock</button>
        <button class="flex-1 bg-green-500 text-white px-4 py-2 rounded-md text-center justify-center" id="paper">Paper</button>
        <button class="flex-1 bg-red-500 text-white px-4 py-2 rounded-md text-center justify-center" id="scissors">Scissors</button>
    </div>
    <div id="resultDiv" class="text-center text-white flex flex-col gap-4">
        <p id="resultP" class="h-6"></p>
        <p id="computerResult" class="h-6"></p>
    </div>
</body>
</html>
