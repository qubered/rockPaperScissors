<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- <script src="./script.js" defer></script> -->
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Rock Paper Scissors</title>
</head>
<body class="flex flex-col gap-12 items-center justify-center h-screen bg-gray-700">
    <div class="flex flex-col items-center justify-center text-white">
        <h1 class="text-4xl font-bold">Rock Paper Scissors</h1>
        <p class="text-lg">Choose your weapon</p>
    </div>
    <div class="flex flex-row gap-4">
        <button class="bg-blue-500 text-white px-4 py-2 rounded-md">Rock</button>
        <button class="bg-green-500 text-white px-4 py-2 rounded-md">Paper</button>
        <button class="bg-red-500 text-white px-4 py-2 rounded-md">Scissors</button>
    </div>
</body>
</html>
